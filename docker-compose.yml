services:
  asa-ai-kiosk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asa-ai-kiosk
    restart: unless-stopped
    ports:
      - "10003:10003"
    volumes:
      # Persist generated gallery images and originals across restarts / rebuilds
      - ./server-code/gallery:/app/gallery
      - ./server-code/uploads:/app/uploads
      # Environment variables (copy .env.example → .env and fill in secrets before first run)
      - ./server-code/.env:/app/.env
    environment:
      - ENABLE_CORS=true
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
