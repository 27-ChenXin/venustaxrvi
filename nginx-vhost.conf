server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  # Replace with your actual domain name
  server_name luminahorizon.example.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  # Allow large photo uploads (camera captures + group shots)
  client_max_body_size 20M;

  # Force HTTPS
  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  # ── Proxy all requests to FastAPI on port 10003 ─────────────────
  location / {
    proxy_pass http://127.0.0.1:10003;
    proxy_http_version 1.1;

    # Standard proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Server $host;

    # WebSocket support (future use)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Extended timeouts for AI processing (Replicate can take 1–2 min)
    proxy_connect_timeout 180s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # Buffering for large image responses
    proxy_buffering           on;
    proxy_buffer_size         128k;
    proxy_buffers             4 256k;
    proxy_busy_buffers_size   256k;
    proxy_temp_file_write_size 256k;
    proxy_max_temp_file_size  0;

    # CORS (FastAPI also sets CORS headers; nginx adds them for static files)
    add_header 'Access-Control-Allow-Origin'  '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization' always;

    # Handle OPTIONS preflight
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin'  '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization' always;
      add_header 'Access-Control-Max-Age'       86400 always;
      add_header 'Content-Length'               0 always;
      return 204;
    }
  }

  # ── Let's Encrypt ACME challenge ────────────────────────────────
  location ^~ /.well-known {
    auth_basic off;
    allow all;
    try_files $uri $uri/ =404;
  }

  {{settings}}

  add_header Cache-Control no-transform;
}
